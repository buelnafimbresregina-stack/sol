<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crucigrama de Animales</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: #121212;
    color: #fff;
    font-family: Arial, sans-serif;
}

#grid {
    display: grid;
    gap: 3px;
    justify-content: center;
}

.cell {
    width: 40px;
    height: 40px;
    text-align: center;
    font-size: 20px;
    text-transform: uppercase;
    border: none;
}

.block {
    background: #1e1e1e;
}

.input {
    background: #2c2c2c;
    color: white;
}

.correct {
    background: #28a745 !important;
}

.hint {
    background: #ffc107;
    color: black;
}

.word-done {
    text-decoration: line-through;
    color: #28a745;
}

</style>
</head>

<body class="container py-4">

<h1 class="text-center">🧩 Crucigrama de Animales</h1>

<div class="text-center mb-3">
    ⏱️ Tiempo: <span id="timer">0</span>s
</div>

<div id="grid"></div>

<div class="mt-4">
    <h4>Palabras:</h4>
    <ul id="wordList"></ul>
</div>

<div class="text-center mt-3">
    <button class="btn btn-danger" onclick="startGame()">Reiniciar</button>
</div>

<script>

const words = ["PERRO","GATO","LEON","TIGRE","OSO","ZORRO","VACA","CABALLO"];

let gridSize = 12;
let grid = [];
let placedWords = [];
let timer = 0;
let interval;

function initGrid() {
    grid = Array(gridSize).fill().map(() => Array(gridSize).fill(""));
}

function canPlace(word, row, col, dir) {
    for (let i = 0; i < word.length; i++) {
        let r = row + (dir === "down" ? i : 0);
        let c = col + (dir === "across" ? i : 0);

        if (r >= gridSize || c >= gridSize) return false;

        if (grid[r][c] !== "" && grid[r][c] !== word[i]) return false;
    }
    return true;
}

function placeWord(word) {
    for (let attempt = 0; attempt < 100; attempt++) {
        let dir = Math.random() > 0.5 ? "across" : "down";
        let row = Math.floor(Math.random() * gridSize);
        let col = Math.floor(Math.random() * gridSize);

        if (canPlace(word, row, col, dir)) {
            for (let i = 0; i < word.length; i++) {
                let r = row + (dir === "down" ? i : 0);
                let c = col + (dir === "across" ? i : 0);
                grid[r][c] = word[i];
            }
            placedWords.push({word,row,col,dir});
            return true;
        }
    }
    return false;
}

function generateCrossword() {
    initGrid();
    placedWords = [];

    words.sort((a,b)=>b.length-a.length);

    words.forEach(w => placeWord(w));
}

function drawGrid() {
    const gridDiv = document.getElementById("grid");
    gridDiv.style.gridTemplateColumns = `repeat(${gridSize}, 40px)`;
    gridDiv.innerHTML = "";

    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            let cell = document.createElement("input");

            if (grid[r][c] === "") {
                cell.className = "cell block";
                cell.disabled = true;
            } else {
                cell.className = "cell input";
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.dataset.letter = grid[r][c];

                if (Math.random() < 0.2) {
                    cell.value = grid[r][c];
                    cell.classList.add("hint");
                }

                cell.maxLength = 1;

                cell.oninput = () => {
                    if (cell.value.toUpperCase() !== cell.dataset.letter) {
                        cell.value = "";
                    } else {
                        cell.classList.add("correct");
                        checkWords();
                    }
                };
            }

            gridDiv.appendChild(cell);
        }
    }
}

function drawWordList() {
    let ul = document.getElementById("wordList");
    ul.innerHTML = "";

    words.forEach(w => {
        let li = document.createElement("li");
        li.id = "word-" + w;
        li.innerText = w;
        ul.appendChild(li);
    });
}

function checkWords() {
    let inputs = document.querySelectorAll(".input");

    placedWords.forEach(p => {
        let correct = true;

        for (let i = 0; i < p.word.length; i++) {
            let r = p.row + (p.dir === "down" ? i : 0);
            let c = p.col + (p.dir === "across" ? i : 0);

            let cell = [...inputs].find(x => x.dataset.row == r && x.dataset.col == c);

            if (!cell || cell.value !== p.word[i]) {
                correct = false;
            }
        }

        if (correct) {
            document.getElementById("word-" + p.word).classList.add("word-done");
        }
    });

    if ([...document.querySelectorAll(".word-done")].length === words.length) {
        clearInterval(interval);

        Swal.fire({
            title: "🎉 ¡Felicidades!",
            text: "Completaste el crucigrama",
            icon: "success"
        });
    }
}

function startTimer() {
    timer = 0;
    document.getElementById("timer").innerText = timer;

    interval = setInterval(() => {
        timer++;
        document.getElementById("timer").innerText = timer;
    }, 1000);
}

function startGame() {
    clearInterval(interval);
    generateCrossword();
    drawGrid();
    drawWordList();
    startTimer();
}

startGame();

</script>

</body>
</html>
