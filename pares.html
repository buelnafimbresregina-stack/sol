<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Pares PRO</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 { margin-top: 20px; }

#controls { margin-top: 10px; }

#game {
    display: grid;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
}

.card {
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    cursor: pointer;
    border-radius: 10px;
    user-select: none;
}

.flipped { background: #00b894; }
.matched { background: #0984e3; cursor: default; }

button, select {
    margin: 5px;
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🧠 Juego de Pares PRO</h1>

<div id="controls">
    <span>Movimientos: <b id="moves">0</b></span> |
    <span>Tiempo: <b id="time">0</b>s</span>
    <br>

    <!-- FIX: cambia automáticamente -->
    <select id="mode" onchange="initGame()">
        <option value="easy">Fácil (4x4)</option>
        <option value="hard">Difícil (6x6)</option>
    </select>

    <button onclick="initGame()">Reiniciar</button>
</div>

<div id="game"></div>

<script>
let symbolsEasy = ["🍕","🍕","🚀","🚀","🐶","🐶","🎮","🎮","🔥","🔥","🌮","🌮","⚽","⚽","🎵","🎵"];

let symbolsHard = [
"🍕","🍕","🚀","🚀","🐶","🐶","🎮","🎮","🔥","🔥","🌮","🌮",
"⚽","⚽","🎵","🎵","🍔","🍔","🚗","🚗","🐱","🐱","🎧","🎧",
"🌈","🌈","🍩","🍩","📱","📱","🧠","🧠","👾","👾","🦄","🦄"
];

let firstCard, secondCard, lock;
let moves, matchedPairs;
let timer, time;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function initGame() {
    const game = document.getElementById("game");
    const mode = document.getElementById("mode").value;

    game.innerHTML = "";
    firstCard = null;
    secondCard = null;
    lock = false;
    moves = 0;
    matchedPairs = 0;
    time = 0;

    document.getElementById("moves").textContent = moves;
    document.getElementById("time").textContent = time;

    clearInterval(timer);
    timer = setInterval(() => {
        time++;
        document.getElementById("time").textContent = time;
    }, 1000);

    let symbols = mode === "hard" ? symbolsHard : symbolsEasy;
    let gridSize = mode === "hard" ? 6 : 4;

    // 🔥 tamaño dinámico
    const cardSize = mode === "hard" ? 60 : 80;
    game.style.gridTemplateColumns = `repeat(${gridSize}, ${cardSize}px)`;

    let shuffled = shuffle([...symbols]);

    shuffled.forEach(symbol => {
        const card = document.createElement("div");
        card.classList.add("card");

        // 🔥 tamaño aplicado a cada carta
        card.style.width = cardSize + "px";
        card.style.height = cardSize + "px";

        card.dataset.symbol = symbol;
        card.innerHTML = "?";

        card.addEventListener("click", () => flipCard(card));
        game.appendChild(card);
    });
}

function flipCard(card) {
    if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");
    card.innerHTML = card.dataset.symbol;

    if (!firstCard) {
        firstCard = card;
    } else {
        secondCard = card;
        lock = true;
        moves++;
        document.getElementById("moves").textContent = moves;

        if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
            firstCard.classList.add("matched");
            secondCard.classList.add("matched");
            matchedPairs++;
            resetTurn();
            checkWin();
        } else {
            setTimeout(() => {
                firstCard.classList.remove("flipped");
                secondCard.classList.remove("flipped");
                firstCard.innerHTML = "?";
                secondCard.innerHTML = "?";
                resetTurn();
            }, 700);
        }
    }
}

function checkWin() {
    const mode = document.getElementById("mode").value;
    const totalPairs = mode === "hard" ? 18 : 8;

    if (matchedPairs === totalPairs) {
        clearInterval(timer);

        Swal.fire({
            title: "🔥 ¡Ganaste!",
            text: `Movimientos: ${moves} | Tiempo: ${time}s`,
            icon: "success",
            confirmButtonText: "Jugar otra vez"
        }).then(() => {
            initGame();
        });
    }
}

function resetTurn() {
    firstCard = null;
    secondCard = null;
    lock = false;
}

initGame();
</script>

</body>
</html>
